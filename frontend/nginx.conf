# nginx do frontend em produção (ver frontend/Dockerfile e docker-compose.prod.yml).

# Se já existir um proxy com HTTPS na frente (Caddy, Traefik, Cloudflare...), ele avisa o protocolo
# original em X-Forwarded-Proto. Sem esse proxy, vale o protocolo desta conexão.
map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não anuncia a versão do nginx nas respostas de erro.
    server_tokens off;
    # Os maiores envios da API (uma compra com muitos itens) ficam muito abaixo disso.
    client_max_body_size 1m;

    # Cabeçalhos de segurança básicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chamadas da API: repassadas para o container "api". O IP real do cliente vai em X-Forwarded-For
    # (a API usa no limite de tentativas de login; ver ASPNETCORE_FORWARDEDHEADERS_ENABLED no compose).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_proto;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Arquivos gerados pelo Vite têm um código no nome (index-1KdJtDwW.js): podem ficar em cache por 1 ano,
    # porque cada nova versão gera nomes novos.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rotas do React (/produtos, /vendas...) não existem como arquivo: devolve o index.html e o
    # React Router mostra a tela. O index.html nunca fica em cache, para a versão nova chegar na hora.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
