<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adega System: gestão de estoque, compras e vendas para adegas e distribuidoras de bebidas." />
    <!-- Cor da barra do navegador no celular: o fundo da página de cada tema (--bg-primary em src/styles/tokens.css). -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <title>Adega System</title>
    <!--
      Aplica o tema salvo antes do React carregar, para a tela não piscar em branco no modo escuro.
      A mesma regra do ThemeProvider (src/theme): "light"/"dark" salvos, ou o tema do sistema.
    -->
    <script>
      (function () {
        var saved = null
        try { saved = localStorage.getItem('adega.theme') } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = dark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-bs-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
